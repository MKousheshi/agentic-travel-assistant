[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad Kousheshi", email = "kowareta993@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "chainlit>=2.11.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.11.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.3",
]

[project.scripts]
api = "app.scripts:run_api"
ui = "app.scripts:run_ui"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
